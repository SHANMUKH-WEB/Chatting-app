kind = "web"
previewPath = "/"
title = "Chat Room"
description = "A friendly shared-room chat app where people can join with a display name, send messages, and catch up on saved conversation history."
version = "1.0.0"
id = "artifacts/chat-room"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20756

[services.development]
run = "pnpm --filter @workspace/chat-room run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chat-room", "run", "build" ]
serve = "static"
publicDir = "artifacts/chat-room/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20756"
BASE_PATH = "/"
